name: Validate QALQON allowlist

on:
  push:
    branches: [main]
    paths: [allowlist.txt, scripts/validate_allowlist.py, .github/workflows/validate.yml]
  pull_request:
    branches: [main]
    paths: [allowlist.txt, scripts/validate_allowlist.py, .github/workflows/validate.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate domains
        run: python scripts/validate_allowlist.py
